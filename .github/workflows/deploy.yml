name: نشر التطبيق على GitHub Pages

# النشر الأساسي صار على Cloudflare Pages؛ هذا المسار احتياطي.
#
# ملاحظة مهمة: لا تُضف فروعاً أخرى هنا. مجموعة التزامن «pages» واحدة
# لكل المستودع، فأي تشغيل من فرع آخر يحجزها ويترك نشرة main واقفة في
# الطابور — وهو ما عطّل النشر سابقاً.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# الصلاحيات المطلوبة للنشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة؛ لا تُلغى نشرة جارية
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع
        run: npx tsc -b --noEmit

      - name: بناء نسخة الإنتاج
        run: npm run build
        env:
          # التطبيق يُنشر تحت https://<user>.github.io/Call-Rent/
          VITE_BASE: /Call-Rent/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # الرفع سريع، لكن خوادم Pages أحياناً تبقى على deployment_in_progress
    # طويلاً. المهلة الافتراضية للإجراء ١٠ دقائق ثم يُلغي النشرة —
    # فتُهدر نشرة ناجحة أصلاً. نرفعها إلى ٤٥ دقيقة ليُترك النشر يكتمل.
    timeout-minutes: 50
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 2700000
          error_count: 20
