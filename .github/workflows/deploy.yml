name: نشر التطبيق على GitHub Pages

on:
  push:
    branches:
      - main
      - claude/investor-management-app-m2g1mu
  workflow_dispatch:

# الصلاحيات المطلوبة للنشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة؛ لا تُلغى نشرة جارية
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع
        run: npx tsc -b --noEmit

      - name: بناء نسخة الإنتاج
        run: npm run build
        env:
          # التطبيق يُنشر تحت https://<user>.github.io/Call-Rent/
          VITE_BASE: /Call-Rent/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
